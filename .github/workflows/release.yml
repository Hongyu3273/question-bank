# 发布新版本:推送 v* 标签(如 v1.0.0)后自动
#   1. 运行测试并创建草稿 Release(说明取自 release-notes/<标签>.md)
#   2. 在 Windows 和 macOS 上分别打包,上传到草稿
#   3. 两个平台都成功后正式发布
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签,例如 v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 检查版本号与标签一致
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json 的版本 $VERSION 和标签 $TAG 不一致" >&2
            exit 1
          fi
      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在,跳过创建"
          else
            gh release create "$TAG" --draft --title "知识题库 $TAG" --notes-file "$NOTES"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 打包并上传到草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有签名证书,不自动查找
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
