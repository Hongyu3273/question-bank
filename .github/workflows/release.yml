# 发布新版本:把 package.json 的 version 改成新版本号并推送到 main(或推送 v* 标签)后自动
#   1. 运行测试;这个版本还没有发布过时,创建草稿 Release(说明取自 release-notes/v<版本>.md)
#   2. 在 Windows 和 macOS 上分别打包,上传到草稿
#   3. 两个平台都成功后正式发布,同时在这次提交上创建 v<版本> 标签
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: 读取版本号,检查是否已经发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "package.json 的版本 $TAG 和标签 ${GITHUB_REF_NAME} 不一致" >&2
            exit 1
          fi
          DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "$TAG 已经发布过,跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.skip == 'false'
        run: npm ci
      - if: steps.version.outputs.skip == 'false'
        run: npm run typecheck
      - if: steps.version.outputs.skip == 'false'
        run: npm test
      - if: steps.version.outputs.skip == 'false'
        name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES="release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "草稿 $TAG 已存在,继续上传"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "知识题库 $TAG" --notes-file "$NOTES"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 打包并上传到草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有签名证书,不自动查找
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish always

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: 正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
