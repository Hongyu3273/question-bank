# 打包配置(M7 阶段会进一步完善)
appId: com.hongyu3273.questionbank
productName: 知识题库
artifactName: question-bank-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 知识题库
mac:
  # 未购买开发者证书,不签名
  identity: null
  category: public.app-category.education
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
publish:
  provider: github
  owner: Hongyu3273
  repo: question-bank
  releaseType: release
